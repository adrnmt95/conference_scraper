[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-conference-discovery"
version = "0.1.0"
description = "Evidence-first conference discovery for economics and political science"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
  "openai>=2,<3",
]

[project.optional-dependencies]
legacy = ["requests>=2.32,<3", "openpyxl>=3.1,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
conference-discover = "conference_agent.discover:main"

[tool.setuptools.packages.find]
include = ["conference_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
